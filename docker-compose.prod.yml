services:
  postgres:
    image: postgres:16-alpine
    container_name: ptgema_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ptgema_local
      POSTGRES_USER: ptgema
      POSTGRES_PASSWORD: ptgema_local_password
    volumes:
      - ptgema_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptgema -d ptgema_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ptgema_backend_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://api.gemateknik.online
    container_name: ptgema_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  ptgema_postgres_prod_data:
